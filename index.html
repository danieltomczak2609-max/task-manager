<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Quest</title>
  <meta name="description" content="Fokus, Zeitmessung und Wochen-Review – ein Task Manager für deine großen Ziele." />
  <meta name="theme-color" content="#0a0a0b" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Quest" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topnav" id="topnav">
    <button class="logo" data-act="go" data-view="home" aria-label="Home"><span class="ring"></span></button>
    <nav class="tabs" id="tabs">
      <button data-act="go" data-view="home">Home</button>
      <button data-act="go" data-view="plan">Plan</button>
      <button data-act="go" data-view="calendar">Kalender</button>
      <button data-act="go" data-view="focus">Fokus</button>
      <button data-act="go" data-view="quests">Quests</button>
      <button data-act="go" data-view="review">Review</button>
    </nav>
    <span class="mobile-title" id="mobile-title"></span>
    <div class="nav-right">
      <button class="searchbtn" data-act="palette"><span>⌕</span><span class="lbl">Suchen oder springen…</span><kbd>⌘K</kbd></button>
      <button class="syncdot" id="syncdot" data-act="settings" title="Synchronisierung"><span></span></button>
      <button class="avatar" data-act="settings" title="Einstellungen">⚙</button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="bottomnav" id="bottomnav">
    <button data-act="go" data-view="home"><span>◐</span>Home</button>
    <button data-act="go" data-view="plan"><span>▦</span>Plan</button>
    <button data-act="go" data-view="calendar"><span>◷</span>Kalender</button>
    <button data-act="go" data-view="focus"><span>◎</span>Fokus</button>
    <button data-act="go" data-view="quests"><span>✦</span>Quests</button>
    <button data-act="go" data-view="review"><span>↗</span>Review</button>
  </nav>

  <div class="runbar" id="runbar" hidden></div>
  <div class="toast" id="toast" role="status"></div>
  <dialog id="dialog"></dialog>
  <div class="palette" id="palette" hidden></div>

  <script src="app.js"></script>
</body>
</html>
